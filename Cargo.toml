[package]
name = "gutun"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
clap = { version = "4.6.7", features = ["derive"] }
tokio = { version = "1.54.0", features = ["full"] }
clap_derive = "4.6.7"
directories = "6.0.0"
reqwest = { version = "0.13.5", features = ["json"] }
aes-gcm = "0.11.1"
spake2 = "0.4.0"
rand = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
hmac = "0.13.0"
sha2 = "0.11.1"
ed25519 = "3.0.0"
ed25519-dalek = { version = "3.0.0", features = ["rand_core"] }
